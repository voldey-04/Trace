name: TRACE CI

on:
  push:
    branches: [main, trace-hardening]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: false

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Production build
        run: npm run build
